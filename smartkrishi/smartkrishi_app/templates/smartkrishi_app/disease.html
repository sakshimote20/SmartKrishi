{% extends 'smartkrishi_app/base.html' %}

{% block title %}Disease Prediction{% endblock %}

{% block content %}
  <div class="disease-container" style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2 style="text-align: center;">🌿 Plant Disease Prediction</h2>
    <p style="text-align: center; color: #555;">Upload a leaf or plant image to detect potential diseases.</p>

    <form id="predict-form" enctype="multipart/form-data" method="POST" style="margin-top: 20px;">
      {% csrf_token %}
      <label for="imageInput" class="custom-file-label">Upload Image</label>
      <input type="file" id="imageInput" name="image" accept="image/*" required class="custom-file-input" />
      <button type="submit" class="btn btn-success" style="margin-top: 18px;">🔍 Predict Disease</button>
    </form>
    <div id="result"></div>
  </div>

  <script>
    document.getElementById("predict-form").addEventListener("submit", async function (e) {
      e.preventDefault();

      const input = document.getElementById("imageInput");
      const file = input.files[0];
      const resultDiv = document.getElementById("result");

      if (!file) {
        alert("Please select an image!");
        return;
      }

      const formData = new FormData();
      formData.append("image", file);

      try {
        const response = await fetch("{% url 'disease-prediction' %}", {
          method: "POST",
          body: formData,
          headers: {
            "X-CSRFToken": "{{ csrf_token }}"
          }
        });

        const data = await response.json();

        if (data.error) {
          resultDiv.innerHTML = `<p style="color:red;">${data.error}</p>`;
        } else {
          const confidenceValue = parseFloat(data.confidence);
          let output = `
            <h4>🩺 Prediction Result</h4>
            <p><strong>Disease:</strong> ${data.disease}</p>
            <p><strong>Confidence:</strong> ${data.confidence}</p>
          `;

          if (confidenceValue < 30) {
            output += `<p style="color:orange;"><em>⚠️ I'm not very confident about this result. Please try a clearer image or consult an expert.</em></p>`;
          } else {
            output += `
              <p><strong>💊 Chemical Treatment:</strong> ${data.chemical_treatment}</p>
              <p><strong>🌱 Biological Treatment:</strong> ${data.biological_treatment}</p>
            `;
          }

          resultDiv.innerHTML = output;
        }

      } catch (err) {
        resultDiv.innerHTML = `<p style="color:red;">Error: ${err}</p>`;
      }
    });
  </script>
{% endblock %}
