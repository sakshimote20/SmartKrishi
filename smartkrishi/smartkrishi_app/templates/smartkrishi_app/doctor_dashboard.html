{% extends "smartkrishi_app/base.html" %}

{% block content %}
<main class="dashboard">
    <h2>👋 Welcome, Dr. {{ user.username }}</h2>

    <p>You can update your availability, specializations, and video call link below:</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Update Profile</button>
    </form>

    <br>
    <p><a href="{% url 'doctor-logout' %}">Logout</a></p>
</main>
{% endblock %}
