{% extends 'smartkrishi_app/base.html' %}

{% block title %}Weather Forecast{% endblock %}

{% block content %}
  <h2>🌤️ Weather Forecast</h2>
  
  <input type="text" id="cityInput" placeholder="Enter city name" />
  <button onclick="getWeather()">Get Weather</button>

  <div id="weatherResult" style="margin-top: 20px;"></div>

  <script>
    async function getWeather() {
      const city = document.getElementById("cityInput").value;
      const resultDiv = document.getElementById("weatherResult");

      if (!city) {
        alert("Please enter a city name.");
        return;
      }

      const apiKey = "0a11156568c74809f00e5fd35c3ce44e";
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.cod !== 200) {
          resultDiv.innerHTML = `<p style="color:red;">Error: ${data.message}</p>`;
          return;
        }

        resultDiv.innerHTML = `
          <p><strong>City:</strong> ${data.name}</p>
          <p><strong>Temperature:</strong> ${data.main.temp} °C</p>
          <p><strong>Humidity:</strong> ${data.main.humidity} %</p>
          <p><strong>Condition:</strong> ${data.weather[0].description}</p>
          <p><strong>Wind Speed:</strong> ${data.wind.speed} m/s</p>
        `;
      } catch (err) {
        resultDiv.innerHTML = `<p style="color:red;">Could not fetch weather data.</p>`;
      }
    }
  </script>
{% endblock %}
